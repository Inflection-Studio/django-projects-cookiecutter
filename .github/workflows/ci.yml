name: Template CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run maintainer pre-commit checks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - name: Test template generation
        run: uv run --locked pytest

  generated-project-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: ci_smoke_project.conf.settings.test
      SMOKE_IMAGE: cookiecutter-django-smoke:ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install template dependencies
        run: uv sync --locked
      - name: Generate Docker project
        run: |
          mkdir -p "${{ runner.temp }}/cookiecutter-smoke"
          uv run --locked cookiecutter . \
            --no-input \
            --output-dir "${{ runner.temp }}/cookiecutter-smoke" \
            project_name="CI Smoke Project" \
            use_docker=y
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/cookiecutter-smoke/ci_smoke_project
        run: uv sync --locked
      - name: Run generated Django smoke tests
        working-directory: ${{ runner.temp }}/cookiecutter-smoke/ci_smoke_project
        run: |
          uv run --locked python manage.py check
          uv run --locked python manage.py makemigrations --check --dry-run
          uv run --locked pytest
      - name: Validate generated Compose configuration
        working-directory: ${{ runner.temp }}/cookiecutter-smoke/ci_smoke_project
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config --quiet
      - name: Build generated Docker image
        working-directory: ${{ runner.temp }}/cookiecutter-smoke/ci_smoke_project
        run: docker build --tag "${SMOKE_IMAGE}" .
      - name: Run generated Docker smoke tests
        run: |
          docker run --rm \
            --entrypoint python \
            --env "DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}" \
            "${SMOKE_IMAGE}" \
            manage.py check
          docker run --rm \
            --entrypoint python \
            "${SMOKE_IMAGE}" \
            -c 'import shutil; import anymail; import django; import gunicorn; import psycopg2; assert shutil.which("uv") is None; assert shutil.which("gcc") is None'
