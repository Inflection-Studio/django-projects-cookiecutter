[project]
name = "django-projects-cookiecutter"
version = "0.1.0"
description = "Maintainer tooling for the InnovateInk Django project template"
authors = [{ name = "Lewis Kori Kihiu" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
cookiecutter = "^2.7.1"
pytest = "^9.0.3"
pytest-cookies = "^0.7"
pyyaml = "^6.0.3"
ruff = "^0.16.4"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["{{cookiecutter.project_slug}}"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
