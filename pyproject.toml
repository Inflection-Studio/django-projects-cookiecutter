[project]
name = "django-projects-cookiecutter"
version = "0.1.0"
description = "Maintainer tooling for the Inflection Studio Django project template"
readme = "README.md"
license = "BSD-3-Clause"
authors = [ { name = "Lewis Kori Kihiu" } ]
requires-python = ">=3.14,<4.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "cookiecutter>=2.7.1,<3",
  "pre-commit>=4.6,<5",
  "pytest>=9.0.3,<10",
  "pytest-cookies>=0.7,<0.8",
  "pyyaml>=6.0.3,<7",
  "ruff>=0.16.4,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [ "{{cookiecutter.project_slug}}" ]
lint.select = [ "B", "E", "F", "I", "UP" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra"
