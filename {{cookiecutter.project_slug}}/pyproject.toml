[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
authors = ["{{ cookiecutter.author_name }} <{{ cookiecutter.author_email }}>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.1"
django-filter = "^24.3"
pillow = "^10.4.0"
django-allauth = "^0.62.1"
django-bootstrap-datepicker-plus = "^5.0.5"
django-environ = "^0.11.2"
django-model-utils = "^4.5.1"
{%- if cookiecutter.has_blog == "y" or cookiecutter.use_taggit == 'y' %}
django-taggit = "^6.1.0"
{% endif %}
{%- if cookiecutter.use_drf == "y" %}
django-cors-headers = "^4.4.0"
djangorestframework = "^3.15.2"
drf-spectacular = "^0.27.2"
drf-spectacular-sidecar = "^2024.5.1"
{%- endif %}
django-extensions = "^3.2.3"
{%- if cookiecutter.use_phone_numbers_field == 'y' %}
django-phonenumber-field = {version = "^8.0.0", extras = ["phonenumberslite"]}
{%- endif %}
django-simple-history = "^3.7.0"
django-widget-tweaks = "^1.5.0"
gunicorn = "^23.0.0"
psycopg2-binary = "^3.2.1"
ipython = "^8.26.0"
django-bootstrap4 = "^24.3"

{%- if cookiecutter.use_martor_editor == 'y' %}
martor = "^1.6.44"
{%- endif %}


[tool.poetry.group.test.dependencies]
pytest = "^8.3.2"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
