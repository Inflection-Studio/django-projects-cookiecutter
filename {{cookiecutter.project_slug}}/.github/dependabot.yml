version: 2
updates:
  # Keep workflow actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the uv project manifest and lockfile current.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      python:
        update-types:
          - "minor"
          - "patch"
    pull-request-branch-name:
      separator: "_"

{% if cookiecutter.use_docker == "y" %}
  # Keep the Python base image on its selected minor release.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker-python:
        patterns:
          - "*"

  # Track the deployment service images separately from the application image.
  - package-ecosystem: "docker"
    directories:
      - "/deploy/nginx"
      - "/deploy/postgres"
      - "/deploy/redis"
    schedule:
      interval: "daily"
    groups:
      docker-services:
        patterns:
          - "*"

  # Scan all Compose files in the project root.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      docker-compose:
        patterns:
          - "*"
{% endif %}
